# CI: quality gates on every push and pull request; deploy to GitHub Pages from the default branch.
#
# One-time repository setup:
#   Settings → Pages → Source: GitHub Actions
#   Settings → Environments → github-pages → Deployment branches: allow the default branch (master)
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      update-screenshots:
        description: Update the visual baselines and commit them to this branch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pages serves the site under /<repository>/ on the owner's github.io; the build, the test server and the
# router read the path, and absolute links (hreflang, canonical) the origin.
env:
  BASE_PATH: /${{ github.event.repository.name }}/
  SITE_ORIGIN: https://${{ github.repository_owner }}.github.io

jobs:
  quality:
    name: Lint and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: apps/shell/build/client/

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: apps/shell/build/client/
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:run
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  # Screenshots of every tenant × page, compared with the baselines in e2e/visual/__screenshots__. They are only
  # valid in this container, so they are made here too, from the same build: run CI by hand (Actions → CI → Run
  # workflow) with "Update the visual baselines" ticked, and this job commits new ones instead of comparing.
  # Keep the image tag equal to the @playwright/test version in package.json.
  visual:
    name: Visual regression
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: apps/shell/build/client/
      - name: Check that the baselines exist
        if: ${{ !inputs.update-screenshots }}
        run: |
          if [ ! -d e2e/visual/__screenshots__ ]; then
            echo "::error title=No visual baselines::This branch has no screenshots to compare with. Run CI by hand on it (Actions → CI → Run workflow) with 'Update the visual baselines' ticked."
            exit 1
          fi
      - name: Compare with the baselines
        if: ${{ !inputs.update-screenshots }}
        run: npm run e2e:visual
      - name: Update the baselines
        if: ${{ inputs.update-screenshots }}
        run: npm run e2e:visual:update
      - name: Commit the baselines
        if: ${{ inputs.update-screenshots }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "The screenshots have not changed."
          else
            git commit -m "test: update the visual baselines"
            git push
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-report
          path: playwright-report/

  # Accessibility, best practices, SEO and layout shift are hard gates; performance fails below 90
  # (see lighthouserc.json).
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: apps/shell/build/client/
      - run: npm run lighthouse
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse
          path: lighthouse-report/

  # Deploys to GitHub Pages after every green push to the default branch: the same build the tests ran against.
  deploy:
    name: Deploy to GitHub Pages
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == github.event.repository.default_branch
    needs: [quality, unit, e2e, visual, lighthouse]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: dist/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
      - uses: actions/deploy-pages@v5
        id: deployment
